<style>
  /* Layout: full-screen 3D island, one floating control card bottom-left, hint chip top-center */

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { TGALoader } from 'three/addons/loaders/TGALoader.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const animSelect = $('animSelect');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
  if (isError) setPanel(true); // errors are only visible inside the panel
}

// the settings panel starts closed so the character stays in view; M toggles it too
function setPanel(open) {
  $('panel').hidden = !open;
  $('menuBtn').setAttribute('aria-expanded', String(open));
  $('menuBtn').textContent = open ? '메뉴 닫기' : '메뉴 열기';
}
$('menuBtn').addEventListener('click', (e) => { setPanel($('panel').hidden); e.currentTarget.blur(); });

// ---------- scene ----------
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6f5);
scene.fog = new THREE.Fog(0xbfe6f5, 28, 70);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x88b866, 1.3));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
scene.add(sun, sun.target);

const ISLAND_R = 28;
const grass = new THREE.Mesh(
  new THREE.CylinderGeometry(ISLAND_R, ISLAND_R + 0.4, 1, 72),
  new THREE.MeshLambertMaterial({ color: 0x86c95f })
);
grass.position.y = -0.5;
grass.receiveShadow = true;
const sand = new THREE.Mesh(
  new THREE.CylinderGeometry(ISLAND_R + 3, ISLAND_R + 4, 0.9, 72),
  new THREE.MeshLambertMaterial({ color: 0xf0dfab })
);
sand.position.y = -0.56;
sand.receiveShadow = true;
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshLambertMaterial({ color: 0x5ec4e0 })
);
water.rotation.x = -Math.PI / 2;
water.position.y = -0.62;
scene.add(grass, sand, water);

// deterministic decoration
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const trees = [];
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x9b6a43 });
const leafMats = [0x4fa64a, 0x5cb85a, 0x3f9645].map((c) => new THREE.MeshLambertMaterial({ color: c, flatShading: true }));
for (let i = 0; i < 26; i++) {
  const a = rand() * Math.PI * 2;
  const r = 6 + rand() * (ISLAND_R - 8);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 1.4, 8), trunkMat);
  trunk.position.y = 0.7;
  const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(1 + rand() * 0.3, 0), leafMats[i % 3]);
  leaves.position.y = 2;
  leaves.scale.y = 1.15;
  for (const m of [trunk, leaves]) { m.castShadow = true; m.receiveShadow = true; }
  t.add(trunk, leaves);
  t.position.set(x, 0, z);
  scene.add(t);
  trees.push({ x, z, r: 0.75 });
}
const flowerColors = [0xffffff, 0xffd94a, 0xff8fb1, 0xff6b5b];
for (let i = 0; i < 90; i++) {
  const a = rand() * Math.PI * 2, r = 2 + rand() * (ISLAND_R - 3);
  const f = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 6, 6),
    new THREE.MeshLambertMaterial({ color: flowerColors[i % 4] })
  );
  f.position.set(Math.cos(a) * r, 0.08, Math.sin(a) * r);
  scene.add(f);
}

const marker = new THREE.Mesh(
  new THREE.RingGeometry(0.25, 0.38, 32),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
);
marker.rotation.x = -Math.PI / 2;
marker.position.y = 0.02;
marker.visible = false;
scene.add(marker);

// ---------- player ----------
const player = new THREE.Group();
scene.add(player);
const turn = new THREE.Group(); // holds the 180° flip
player.add(turn);

let avatar = null;      // current visual root inside `turn`
let sample = null;      // parts of the procedural sample villager
let mixer = null;
let actions = [];       // { name, action }
let idleAction = null, walkAction = null, current = null;
let blobUrls = [];
let rig = null;         // bones driven by code when a model has a skeleton but no clips
let outfits = null;     // meshes that are alternative versions of the same clothing piece

// Game rips often stack every clothing variant on the body (e.g. mTops__TshirtsN, mTops__OnepieceH).
// Meshes sharing a name prefix and material are treated as variants and only one is shown.
function setupOutfits(obj) {
  const groups = new Map();
  obj.traverse((o) => {
    if (!o.isMesh || !o.name.includes('__')) return;
    const mat = [].concat(o.material)[0]?.name || '';
    const key = `${o.name.split('__')[0]}|${mat}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(o);
  });
  const set = [...groups.values()].filter((g) => g.length > 1).sort((a, b) => b.length - a.length)[0];
  if (!set) return null;
  set.sort((a, b) => a.name.localeCompare(b.name));
  const sel = $('outfitSelect');
  sel.innerHTML = '';
  set.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = outfitLabel(m.name.split('__').slice(1).join('__'));
    sel.appendChild(opt);
  });
  const preferred = set.findIndex((m) => /N$/.test(m.name) && !/mydesign|emm/i.test(m.name));
  sel.value = String(preferred >= 0 ? preferred : 0);
  $('outfitField').hidden = false;
  return set;
}

// Animal Crossing clothing mesh names: <type>[mydesign|emm]<sleeve N/H/L>, e.g. TshirtsH, OnepiecemydesignN
function outfitLabel(raw) {
  const m = raw.match(/^(Onepiece|Tshirts)(mydesign|emm)?([NHL])?$/i);
  if (!m) return raw;
  const type = /onepiece/i.test(m[1]) ? '원피스' : '티셔츠';
  const sleeve = { N: '민소매', H: '반팔', L: '긴팔' }[(m[3] || '').toUpperCase()] || '기본';
  const extra = m[2] ? (/mydesign/i.test(m[2]) ? ' · 마이디자인용' : ' · emm') : '';
  return `${type} · ${sleeve}${extra} (${raw})`;
}

function showOutfit(i) {
  outfits?.forEach((m, j) => { m.visible = j === i; });
}

// Animal Crossing style rigs share these bone names; other rigs fall back to a whole-body waddle.
const RIG_BONES = {
  legL: /^Leg_1_L$/i, legR: /^Leg_1_R$/i,
  armL: /^Arm_1_L$/i, armR: /^Arm_1_R$/i,
  spine: /^Spine_1$/i, head: /^Head$/i, tail: /^TailRoot$/i,
};
const AXIS_X = new THREE.Vector3(1, 0, 0);
const AXIS_Y = new THREE.Vector3(0, 1, 0);
const AXIS_Z = new THREE.Vector3(0, 0, 1);

function setupRig(obj, frame) {
  frame.updateMatrixWorld(true);
  const frameInv = frame.getWorldQuaternion(new THREE.Quaternion()).invert();
  // FBX exports can carry one copy of the skeleton per mesh, so every key holds all matching bones
  const bones = {};
  obj.traverse((o) => {
    if (!o.isBone || !o.parent) return;
    for (const [key, re] of Object.entries(RIG_BONES)) {
      if (!re.test(o.name)) continue;
      // parent orientation expressed in the character's own frame (+Y up, +Z forward)
      const parentQ = frameInv.clone().multiply(o.parent.getWorldQuaternion(new THREE.Quaternion()));
      (bones[key] ||= []).push({ bone: o, base: o.quaternion.clone(), parentQ, parentInv: parentQ.clone().invert() });
    }
  });
  if (!bones.legL || !bones.legR) return null;
  return bones;
}

const _dq = new THREE.Quaternion();
const _tq = new THREE.Quaternion();
// rotate bones from their bind pose by (axis, angle) pairs given in the character frame;
// the last pair is applied first
function turnBone(entries, ...rot) {
  if (!entries) return;
  _dq.identity();
  for (let i = 0; i < rot.length; i += 2) _dq.multiply(_tq.setFromAxisAngle(rot[i], rot[i + 1]));
  for (const e of entries) {
    e.bone.quaternion.copy(e.parentInv).multiply(_dq).multiply(e.parentQ).multiply(e.base);
  }
}

function makeSample() {
  const root = new THREE.Group();
  const mat = (c) => new THREE.MeshLambertMaterial({ color: c });
  const fur = mat(0xf3c58f), shirt = mat(0x5aa9e6), dark = mat(0x2b2118), pink = mat(0xff9fae), pants = mat(0x6b5a8e);

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 16), shirt);
  body.scale.set(1, 1.05, 0.9);
  body.position.y = 0.62;

  const head = new THREE.Group();
  head.position.y = 1.22;
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 20), fur);
  skull.scale.set(1.08, 0.95, 1);
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), mat(0xfff0dc));
  muzzle.position.set(0, -0.12, 0.42);
  muzzle.scale.set(1.2, 0.8, 0.7);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), dark);
  nose.position.set(0, -0.06, 0.55);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 10), dark);
  eyeL.position.set(-0.18, 0.06, 0.45);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.18;
  const blushL = new THREE.Mesh(new THREE.CircleGeometry(0.07, 16), pink);
  blushL.position.set(-0.3, -0.08, 0.41); blushL.rotation.y = -0.5;
  const blushR = blushL.clone(); blushR.position.x = 0.3; blushR.rotation.y = 0.5;
  const earGeo = new THREE.ConeGeometry(0.16, 0.32, 4);
  const earL = new THREE.Mesh(earGeo, fur);
  earL.position.set(-0.3, 0.45, 0); earL.rotation.z = 0.35;
  const earR = earL.clone(); earR.position.x = 0.3; earR.rotation.z = -0.35;
  head.add(skull, muzzle, nose, eyeL, eyeR, blushL, blushR, earL, earR);

  const limb = (geo, m, x, y) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.y = -geo.parameters.height / 2;
    pivot.add(mesh);
    return pivot;
  };
  const legGeo = new THREE.CylinderGeometry(0.09, 0.1, 0.36, 10);
  const armGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.34, 10);
  const legL = limb(legGeo, pants, -0.14, 0.38);
  const legR = limb(legGeo, pants, 0.14, 0.38);
  const armL = limb(armGeo, fur, -0.38, 0.82);
  const armR = limb(armGeo, fur, 0.38, 0.82);
  armL.rotation.z = 0.25; armR.rotation.z = -0.25;

  root.add(body, head, legL, legR, armL, armR);
  root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return { root, body, head, legL, legR, armL, armR };
}

function clearAvatar() {
  if (avatar) {
    turn.remove(avatar);
    avatar.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      mats.forEach((m) => { for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose(); m.dispose(); });
    });
  }
  if (mixer) mixer.stopAllAction();
  mixer = null; actions = []; idleAction = walkAction = current = null;
  sample = null; avatar = null; rig = null; outfits = null;
  $('outfitField').hidden = true;
  blobUrls.forEach((u) => URL.revokeObjectURL(u));
  blobUrls = [];
  animSelect.innerHTML = '<option value="auto">자동 (멈추면 대기, 움직이면 걷기)</option>';
  animSelect.disabled = true;
}

function useSample() {
  clearAvatar();
  sample = makeSample();
  avatar = sample.root;
  turn.add(avatar);
  turn.rotation.y = 0;
}

// ---------- file loading ----------
function fitToHeight(obj, target = 1.7) {
  obj.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(obj);
  const h = box.max.y - box.min.y;
  if (!isFinite(h) || h <= 0) return;
  obj.scale.multiplyScalar(target / h);
  obj.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.x -= c.x;
  obj.position.z -= c.z;
  obj.position.y -= box.min.y;
}

function pickClip(re) {
  return actions.find((a) => re.test(a.name))?.action || null;
}

function play(action) {
  if (!action || action === current) return;
  action.reset().setEffectiveWeight(1).fadeIn(0.25).play();
  if (current) current.fadeOut(0.25);
  current = action;
}

async function expandZips(list) {
  const out = [];
  for (const f of list) {
    if (!/\.zip$/i.test(f.name)) { out.push(f); continue; }
    if (!window.JSZip) throw new Error('zip 라이브러리를 못 불러왔어. 압축을 풀어서 폴더 열기로 해줘.');
    const zip = await JSZip.loadAsync(f);
    for (const entry of Object.values(zip.files)) {
      if (entry.dir || entry.name.includes('__MACOSX')) continue;
      const blob = await entry.async('blob');
      out.push(new File([blob], entry.name.split('/').pop()));
    }
  }
  return out;
}

// Collada rips render more reliably than FBX ones; FBX materials often come out see-through.
const MODEL_PRIORITY = ['glb', 'gltf', 'dae', 'fbx'];

// ColladaLoader names bones by their sid (joint0, joint1, …). Restore the readable node names.
async function restoreColladaBoneNames(file, obj) {
  const doc = new DOMParser().parseFromString(await file.text(), 'application/xml');
  const names = new Map();
  for (const n of doc.querySelectorAll('node[type="JOINT"]')) {
    const sid = n.getAttribute('sid'), name = n.getAttribute('name') || n.getAttribute('id');
    if (sid && name) names.set(sid, name);
  }
  obj.traverse((o) => { if (o.isBone && names.has(o.name)) o.name = names.get(o.name); });
}

async function loadFiles(fileList) {
  let files;
  try {
    setStatus('파일 읽는 중…');
    files = await expandZips([...fileList]);
  } catch (err) {
    setStatus(`zip 열기 실패: ${err?.message || err}`, true);
    return;
  }
  const extOf = (f) => f.name.split('.').pop().toLowerCase();
  const main = files
    .filter((f) => MODEL_PRIORITY.includes(extOf(f)))
    .sort((a, b) => MODEL_PRIORITY.indexOf(extOf(a)) - MODEL_PRIORITY.indexOf(extOf(b)))[0];
  if (!main) {
    setStatus('모델 파일(.dae .fbx .glb .gltf)을 못 찾았어. 모델 파일이랑 텍스처 이미지를 같이 골라줘.', true);
    return;
  }
  setStatus(`${main.name} 불러오는 중…`);

  const urls = new Map();
  const newBlobs = [];
  for (const f of files) {
    const u = URL.createObjectURL(f);
    newBlobs.push(u);
    urls.set(f.name.toLowerCase(), u);
  }
  const mainUrl = urls.get(main.name.toLowerCase());
  const missing = new Set();

  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => {
    if (url === mainUrl || url.startsWith('data:')) return url;
    const base = decodeURIComponent(url.split(/[\\/]/).pop().split('?')[0]).toLowerCase();
    if (urls.has(base)) return urls.get(base);
    if (base) missing.add(base);
    return url;
  });
  manager.addHandler(/\.tga$/i, new TGALoader(manager));

  const ext = main.name.split('.').pop().toLowerCase();
  let obj, clips;
  try {
    // Parse the model from memory: the artifact viewer's CSP refuses fetch() on blob: URLs,
    // so loader.load(blobUrl) fails there. Textures still go through <img>, which is allowed.
    const base = 'local/';
    if (ext === 'dae') {
      const c = new ColladaLoader(manager).parse(await main.text(), base);
      obj = c.scene; clips = c.scene.animations || [];
      await restoreColladaBoneNames(main, obj);
    } else if (ext === 'fbx') {
      obj = new FBXLoader(manager).parse(await main.arrayBuffer(), base);
      clips = obj.animations || [];
    } else {
      const data = ext === 'gltf' ? await main.text() : await main.arrayBuffer();
      const g = await new Promise((res, rej) => new GLTFLoader(manager).parse(data, base, res, rej));
      obj = g.scene; clips = g.animations || [];
    }
  } catch (err) {
    newBlobs.forEach((u) => URL.revokeObjectURL(u));
    setStatus(`불러오기 실패: ${err?.message || err}. 다른 포맷(.fbx/.dae)으로 받아서 다시 해봐.`, true);
    return;
  }

  clearAvatar();
  blobUrls = newBlobs;
  obj.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (!m) return;
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        if (m.map && m.transparent) m.alphaTest = 0.4;
      });
    }
  });
  fitToHeight(obj);
  avatar = new THREE.Group();
  avatar.add(obj);
  turn.add(avatar);

  if (clips.length) {
    mixer = new THREE.AnimationMixer(obj);
    actions = clips.map((clip, i) => ({ name: clip.name || `clip ${i + 1}`, action: mixer.clipAction(clip) }));
    idleAction = pickClip(/idle|wait|stand|breath/i) || actions[0].action;
    walkAction = pickClip(/walk|run|move/i) || (actions.length > 1 ? actions[1].action : actions[0].action);
    for (const a of actions) {
      const opt = document.createElement('option');
      opt.value = a.name;
      opt.textContent = a.name;
      animSelect.appendChild(opt);
    }
    animSelect.disabled = false;
    play(idleAction);
  }

  if (!clips.length) rig = setupRig(obj, avatar);
  // Animal Crossing rips include a placeholder hat mesh (Cap__…) that the game hides by default
  obj.traverse((o) => { if (o.isMesh && /^Cap__/i.test(o.name)) o.visible = false; });
  outfits = setupOutfits(obj);
  if (outfits) showOutfit(Number($('outfitSelect').value));

  const animNote = clips.length
    ? `애니메이션 ${clips.length}개 찾았어.`
    : rig
      ? '애니메이션은 없지만 뼈대를 찾아서 걷기 동작을 직접 붙였어.'
      : '애니메이션이 없어서 통통 튀는 걸음으로 대신 움직여.';
  const texNote = missing.size
    ? ` 텍스처 ${missing.size}개를 못 찾았어 (${[...missing].slice(0, 3).join(', ')}${missing.size > 3 ? ' …' : ''}). 폴더 열기로 다시 해봐.`
    : '';
  setStatus(`${main.name} 불러왔어. ${animNote}${texNote}`, missing.size > 0);
}

$('openFiles').addEventListener('click', () => $('fileInput').click());
$('openFolder').addEventListener('click', () => $('folderInput').click());
$('fileInput').addEventListener('change', (e) => { if (e.target.files.length) loadFiles(e.target.files); e.target.value = ''; });
$('folderInput').addEventListener('change', (e) => { if (e.target.files.length) loadFiles(e.target.files); e.target.value = ''; });
$('reset').addEventListener('click', () => { useSample(); setStatus('샘플 주민으로 돌아왔어.'); });
$('flip').addEventListener('click', () => { turn.rotation.y = turn.rotation.y ? 0 : Math.PI; });
$('outfitSelect').addEventListener('change', (e) => {
  showOutfit(Number(e.target.value));
  camDist = 5.5; // the variants differ in sleeves and hem, so zoom in to show the change
  setStatus(`옷을 ${e.target.selectedOptions[0].textContent}(으)로 바꿨어. 소매 길이랑 하의가 달라져.`);
});
animSelect.addEventListener('change', () => {
  if (animSelect.value === 'auto') { current = null; mixer?.stopAllAction(); play(idleAction); return; }
  const a = actions.find((x) => x.name === animSelect.value);
  if (a) play(a.action);
});

const drop = $('drop');
let dragDepth = 0;
addEventListener('dragenter', (e) => { e.preventDefault(); dragDepth++; drop.hidden = false; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; drop.hidden = true; } });
addEventListener('dragover', (e) => e.preventDefault());
addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0; drop.hidden = true;
  if (e.dataTransfer?.files?.length) loadFiles(e.dataTransfer.files);
});

// ---------- input ----------
const keys = new Set();
const MOVE_KEYS = { KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1], KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('select')) return;
  if (MOVE_KEYS[e.code]) { keys.add(e.code); target = null; marker.visible = false; e.preventDefault(); }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) jump(); }
  if (e.code === 'KeyE' && !e.repeat) wave();
  if (e.code === 'KeyM' && !e.repeat) setPanel($('panel').hidden);
});

// ---------- actions ----------
const GRAVITY = 20;
const WAVE_TIME = 1.8;
let jumpY = 0, vy = 0, airborne = false;
let waveT = 0;

function jump() {
  if (airborne) return;
  airborne = true;
  vy = 6.2;
}
function wave() {
  waveT = WAVE_TIME;
  const clip = actions.find((a) => /wave|greet|hello/i.test(a.name));
  if (clip) { animSelect.value = clip.name; play(clip.action); }
}
$('jumpBtn').addEventListener('click', (e) => { jump(); e.currentTarget.blur(); });
$('waveBtn').addEventListener('click', (e) => { wave(); e.currentTarget.blur(); });
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

let target = null;
let downAt = null;
const ray = new THREE.Raycaster();
canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8) return;
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObject(grass)[0];
  if (hit) {
    target = new THREE.Vector3(hit.point.x, 0, hit.point.z);
    marker.position.set(target.x, 0.02, target.z);
    marker.visible = true;
  }
});

let camDist = 11;
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.01, 5, 20);
}, { passive: false });

// ---------- loop ----------
const SPEED = 3.2;
const clock = new THREE.Clock();
let phase = 0;
let moving = false;
const camPos = new THREE.Vector3();
const lookAt = new THREE.Vector3();

function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function step(dt) {
  const dir = new THREE.Vector3();
  for (const k of keys) { dir.x += MOVE_KEYS[k][0]; dir.z += MOVE_KEYS[k][1]; }
  if (target) {
    dir.set(target.x - player.position.x, 0, target.z - player.position.z);
    if (dir.length() < 0.12) { target = null; marker.visible = false; dir.set(0, 0, 0); }
  }
  moving = dir.lengthSq() > 0;
  if (moving) {
    dir.normalize();
    const next = player.position.clone().addScaledVector(dir, SPEED * dt);
    for (const t of trees) {
      const dx = next.x - t.x, dz = next.z - t.z, d = Math.hypot(dx, dz);
      if (d < t.r + 0.35) { const s = (t.r + 0.35) / (d || 1); next.x = t.x + dx * s; next.z = t.z + dz * s; }
    }
    const rr = Math.hypot(next.x, next.z);
    if (rr > ISLAND_R - 0.8) next.multiplyScalar((ISLAND_R - 0.8) / rr);
    player.position.copy(next);
    const want = Math.atan2(dir.x, dir.z);
    let diff = want - player.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, dt * 12);
    phase += dt * 9;
  } else {
    phase += dt * 2;
  }

  if (airborne) {
    vy -= GRAVITY * dt;
    jumpY += vy * dt;
    if (jumpY <= 0) { jumpY = 0; vy = 0; airborne = false; }
  }
  player.position.y = jumpY;
  waveT = Math.max(0, waveT - dt);
  // 0→1→0 envelope so the arm eases up and back down
  const waveK = waveT > 0 ? Math.min(1, (WAVE_TIME - waveT) * 5, waveT * 5) : 0;
  const waveSwing = Math.sin((WAVE_TIME - waveT) * 13) * 0.35;
  const air = airborne ? 1 : 0;

  // animation
  if (mixer) {
    if (animSelect.value === 'auto') play(moving ? walkAction : idleAction);
    mixer.update(dt);
  } else if (sample) {
    const swing = moving ? Math.sin(phase) * 0.7 : 0;
    sample.legL.rotation.x = swing;
    sample.legR.rotation.x = -swing;
    sample.armL.rotation.x = -swing * 0.8;
    sample.armR.rotation.x = swing * 0.8;
    const bob = moving ? Math.abs(Math.sin(phase)) * 0.06 : (reduceMotion ? 0 : Math.sin(phase) * 0.015);
    sample.root.position.y = bob;
    sample.head.rotation.z = moving ? Math.sin(phase) * 0.06 : 0;
    if (air) {
      sample.legL.rotation.x = sample.legR.rotation.x = -0.5;
      sample.armL.rotation.z = 0.25 + 1.2; sample.armR.rotation.z = -0.25 - 1.2;
    } else {
      sample.armL.rotation.z = 0.25; sample.armR.rotation.z = -0.25;
    }
    if (waveK) {
      // right hand on screen-left of the villager: lift the +x arm overhead and swing it
      sample.armR.rotation.x = 0;
      sample.armR.rotation.z = -0.25 + waveK * (2.7 + waveSwing);
      sample.head.rotation.z = waveK * 0.12;
    }
  } else if (rig) {
    const s = Math.sin(phase);
    const k = moving && !air ? 1 : 0;
    turnBone(rig.legL, AXIS_X, air ? -0.6 : s * 0.55 * k);
    turnBone(rig.legR, AXIS_X, air ? -0.35 : -s * 0.55 * k);
    // bind pose is a T-pose (left arm along +X, right along -X): lower both to the sides,
    // raise them a little while airborne, and swing them around X while walking
    const ARM_DOWN = 1.25;
    turnBone(rig.armL, AXIS_X, -s * 0.5 * k, AXIS_Z, air ? 0.5 : -ARM_DOWN);
    if (waveK) {
      const down = ARM_DOWN * (1 - waveK);
      const up = waveK * (0.45 + waveSwing); // big head: keep the hand low enough to peek out beside it
      turnBone(rig.armR, AXIS_Z, down - up);
    } else {
      turnBone(rig.armR, AXIS_X, s * 0.5 * k, AXIS_Z, air ? -0.5 : ARM_DOWN);
    }
    turnBone(rig.spine, AXIS_Y, s * 0.08 * k);
    turnBone(rig.head, AXIS_Z, waveK ? waveK * -0.15 : moving ? s * 0.06 : (reduceMotion ? 0 : Math.sin(phase * 0.7) * 0.04));
    turnBone(rig.tail, AXIS_Y, reduceMotion ? 0 : Math.sin(phase * (moving ? 1 : 1.6)) * 0.35);
    avatar.position.y = moving && !air ? Math.abs(s) * 0.05 : 0;
  } else if (avatar) {
    avatar.position.y = moving && !air ? Math.abs(Math.sin(phase)) * 0.08 : 0;
    avatar.rotation.z = waveK ? waveSwing * 0.3 : moving ? Math.sin(phase) * 0.07 : 0;
  }

  if (marker.visible && !reduceMotion) marker.scale.setScalar(1 + Math.sin(clock.elapsedTime * 6) * 0.1);

  // camera: high angle when far, lower and more frontal as you zoom in
  const zoomT = (camDist - 5) / 15;
  camPos.set(player.position.x, 0.8 + camDist * (0.2 + 0.52 * zoomT), player.position.z + camDist * 0.85);
  camera.position.lerp(camPos, Math.min(1, dt * 5));
  lookAt.set(player.position.x, 0.8, player.position.z);
  camera.lookAt(lookAt);

  sun.position.set(player.position.x + 8, 14, player.position.z + 6);
  sun.target.position.copy(player.position);
}

// A copy published with model/manifest.json next to the page opens that model on start.
async function loadBundled() {
  try {
    const res = await fetch('model/manifest.json', { cache: 'no-store' });
    if (!res.ok) return;
    const { files } = await res.json();
    // entries are "file.png" or { path: "model.xml", name: "model.dae" } when the host renames an extension
    const loaded = await Promise.all(files.map(async (entry) => {
      const { path, name } = typeof entry === 'string' ? { path: entry, name: entry } : entry;
      const r = await fetch(`model/${encodeURIComponent(path)}`);
      if (!r.ok) throw new Error(path);
      return new File([await r.blob()], name);
    }));
    await loadFiles(loaded);
  } catch {
    // no bundled model: keep the sample villager
  }
}

useSample();
loadBundled();
camera.position.set(0, camDist * 0.72, camDist * 0.78);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  renderer.render(scene, camera);
});
</script>
