<title>섬 산책 놀이터</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: full-screen 3D island, one floating control card bottom-left, hint chip top-center */
  :root {
    --sky: #bfe6f5;
    --panel: rgba(255, 252, 240, 0.94);
    --ink: #3d3324;
    --muted: #7b6c55;
    --accent: #2e9a68;
    --accent-ink: #ffffff;
    --line: rgba(61, 51, 36, 0.16);
    --error: #c2492f;
    --font-display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --panel: rgba(38, 34, 28, 0.94);
      --ink: #f3ead8;
      --muted: #b9ab92;
      --accent: #4cc48c;
      --accent-ink: #10231a;
      --line: rgba(243, 234, 216, 0.16);
      --error: #f08a6e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --panel: rgba(38, 34, 28, 0.94);
    --ink: #f3ead8;
    --muted: #b9ab92;
    --accent: #4cc48c;
    --accent-ink: #10231a;
    --line: rgba(243, 234, 216, 0.16);
    --error: #f08a6e;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--sky);
    color: var(--ink);
    font-family: var(--font-body);
    overflow: hidden;
    touch-action: none;
  }
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  .hint {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
    max-width: calc(100% - 32px);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .dock {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .dock .btn { background: var(--panel); box-shadow: 0 4px 14px rgba(30, 60, 40, 0.18); }
  .dock .btn.primary { background: var(--accent); }
  .dock .btn[aria-expanded="true"] { border-color: var(--accent); }
  .card {
    position: fixed;
    left: 16px;
    bottom: calc(68px + env(safe-area-inset-bottom, 0px));
    max-height: calc(100% - 140px);
    overflow-y: auto;
    width: min(340px, calc(100% - 32px));
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 14px 16px;
    display: grid;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(30, 60, 40, 0.18);
  }
  .card h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 20px;
    letter-spacing: 0.01em;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn {
    font-family: var(--font-display);
    font-size: 15px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .btn kbd { font-family: var(--font-body); font-size: 11px; opacity: 0.75; margin-left: 4px; }
  .btn:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  label.field { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
  select {
    font: inherit;
    font-size: 14px;
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 6px 8px;
  }
  .status { margin: 0; font-size: 13px; line-height: 1.5; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .status.error { color: var(--error); }
  .note { margin: 0; font-size: 11.5px; line-height: 1.5; color: var(--muted); }


  /* ---- performance mode: 3D stage on top, rhythm lanes below ---- */
  body.playing #stage { height: 54%; }
  body.playing .hint, body.playing .dock, body.playing .card { display: none !important; }
  .rhythm {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 46%;
    background: #1b2130;
    border-top: 3px solid #f4d36b;
  }
  .rhythm canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .rhythm .stop {
    position: absolute;
    top: 10px; right: 12px;
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
    border-color: rgba(255, 255, 255, 0.25);
  }
  .sheet {
    position: fixed;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(380px, calc(100% - 32px));
    max-height: calc(100% - 32px);
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 18px;
    display: grid;
    gap: 12px;
    box-shadow: 0 16px 40px rgba(20, 40, 30, 0.3);
  }
  .sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
  .sheet fieldset { border: 0; margin: 0; padding: 0; display: grid; gap: 6px; }
  .sheet legend { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .choice {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--line); border-radius: 12px;
    padding: 10px 12px; cursor: pointer;
  }
  .choice:has(input:checked) { border-color: var(--accent); }
  .choice strong { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
  .choice small { display: block; color: var(--muted); font-size: 12px; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg .choice { flex: 1; justify-content: center; padding: 8px; }
  .result-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; font-variant-numeric: tabular-nums; }
  .result-grid div { border: 1px solid var(--line); border-radius: 10px; padding: 6px 2px; font-size: 12px; color: var(--muted); }
  .result-grid b { display: block; font-size: 18px; color: var(--ink); font-family: var(--font-display); font-weight: 400; }
  .rank { font-family: var(--font-display); font-size: 44px; line-height: 1; color: var(--accent); }
  .big-num { font-family: var(--font-display); font-size: 28px; }
  .drop {
    position: fixed;
    inset: 12px;
    border: 3px dashed var(--accent);
    border-radius: 24px;
    background: rgba(46, 154, 104, 0.12);
    display: grid;
    place-items: center;
    font-family: var(--font-display);
    font-size: 24px;
    color: var(--ink);
    pointer-events: none;
  }
  input[type="file"] { display: none; }
  [hidden] { display: none !important; }
</style>

<canvas id="stage" aria-label="3D 섬 화면"></canvas>
<div class="hint" id="hint">WASD 이동 · 탭 이동 · 휠 줌 · M 메뉴 · P 연주</div>

<section class="card" id="panel" aria-label="캐릭터 설정" hidden>
  <h1>섬 산책 놀이터</h1>
  <div class="row">
    <button class="btn primary" id="openFiles" type="button">모델 파일 열기</button>
    <button class="btn" id="openFolder" type="button">폴더 열기</button>
  </div>
  <label class="field" for="animSelect">애니메이션
    <select id="animSelect" disabled>
      <option value="auto">자동 (멈추면 대기, 움직이면 걷기)</option>
    </select>
  </label>
  <label class="field" for="outfitSelect" id="outfitField" hidden>옷
    <select id="outfitSelect"></select>
  </label>
  <div class="row">
    <button class="btn" id="flip" type="button">방향 180° 돌리기</button>
    <button class="btn" id="reset" type="button">샘플로 되돌리기</button>
  </div>
  <p class="status" id="status" role="status">샘플 주민으로 시작했어. 받은 zip을 그대로 열거나 화면에 끌어다 놓으면 바뀌어.</p>
  <p class="note">파일은 이 브라우저 안에서만 읽어. 어디에도 업로드하지 않아.</p>
  <input type="file" id="fileInput" multiple accept=".zip,.dae,.fbx,.glb,.gltf,.bin,.png,.jpg,.jpeg,.tga,.webp,.bmp">
  <input type="file" id="folderInput" webkitdirectory multiple>
</section>

<div class="dock">
  <button class="btn" id="menuBtn" type="button" aria-controls="panel" aria-expanded="false">메뉴 열기</button>
  <div class="row">
    <button class="btn primary" id="jumpBtn" type="button">점프 <kbd>Space</kbd></button>
    <button class="btn primary" id="waveBtn" type="button">손 흔들기 <kbd>E</kbd></button>
    <button class="btn primary" id="playBtn" type="button">연주하기 <kbd>P</kbd></button>
  </div>
</div>

<section class="sheet" id="songSheet" role="dialog" aria-modal="true" aria-labelledby="songTitle" hidden>
  <h2 id="songTitle">연주할 곡 고르기</h2>
  <fieldset>
    <legend>악보</legend>
    <label class="choice"><input type="radio" name="song" value="canon" checked>
      <span><strong>캐논 D장조 · 파헬벨</strong><small>♩=76 · 약 1분 · 변주 4개</small></span></label>
  </fieldset>
  <fieldset>
    <legend>난이도</legend>
    <div class="seg">
      <label class="choice"><input type="radio" name="level" value="easy" checked> 쉬움</label>
      <label class="choice"><input type="radio" name="level" value="normal"> 보통</label>
    </div>
  </fieldset>
  <label class="choice"><input type="checkbox" id="autoPlay"> <span>자동 연주로 감상하기<small>노트를 대신 쳐줘</small></span></label>
  <p class="note">떨어지는 노트가 노란 선에 닿을 때 D · F · J · K를 눌러. 모바일은 해당 칸을 터치하면 돼.</p>
  <div class="row">
    <button class="btn primary" id="startSong" type="button">연주 시작</button>
    <button class="btn" id="cancelSong" type="button">닫기</button>
  </div>
</section>

<div class="rhythm" id="rhythm" hidden>
  <canvas id="rhythmCanvas" aria-label="리듬 게임 노트 레인"></canvas>
  <button class="btn stop" id="stopSong" type="button">그만하기 <kbd>Esc</kbd></button>
</div>

<section class="sheet" id="resultSheet" role="dialog" aria-modal="true" aria-labelledby="resultTitle" hidden>
  <h2 id="resultTitle">연주 끝!</h2>
  <div class="row" style="justify-content: space-between">
    <div><div class="note">정확도</div><div class="big-num" id="resAcc">0%</div></div>
    <div class="rank" id="resRank">A</div>
  </div>
  <div class="result-grid">
    <div><b id="resPerfect">0</b>Perfect</div>
    <div><b id="resGreat">0</b>Great</div>
    <div><b id="resGood">0</b>Good</div>
    <div><b id="resMiss">0</b>Miss</div>
  </div>
  <p class="note" id="resCombo">최대 콤보 0</p>
  <div class="row">
    <button class="btn primary" id="againSong" type="button">다시 연주</button>
    <button class="btn" id="closeResult" type="button">섬으로 돌아가기</button>
  </div>
</section>

<div class="drop" id="drop" hidden>여기에 놓으면 캐릭터가 바뀌어</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { ColladaLoader } from 'three/addons/loaders/ColladaLoader.js';
import { TGALoader } from 'three/addons/loaders/TGALoader.js';

const $ = (id) => document.getElementById(id);
const statusEl = $('status');
const animSelect = $('animSelect');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg;
  statusEl.classList.toggle('error', isError);
  if (isError) setPanel(true); // errors are only visible inside the panel
}

// the settings panel starts closed so the character stays in view; M toggles it too
function setPanel(open) {
  $('panel').hidden = !open;
  $('menuBtn').setAttribute('aria-expanded', String(open));
  $('menuBtn').textContent = open ? '메뉴 닫기' : '메뉴 열기';
}
$('menuBtn').addEventListener('click', (e) => { setPanel($('panel').hidden); e.currentTarget.blur(); });

// ---------- scene ----------
const canvas = $('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfe6f5);
scene.fog = new THREE.Fog(0xbfe6f5, 28, 70);

const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x88b866, 1.3));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.2);
sun.position.set(8, 14, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 1, far: 50 });
scene.add(sun, sun.target);

const ISLAND_R = 28;
const grass = new THREE.Mesh(
  new THREE.CylinderGeometry(ISLAND_R, ISLAND_R + 0.4, 1, 72),
  new THREE.MeshLambertMaterial({ color: 0x86c95f })
);
grass.position.y = -0.5;
grass.receiveShadow = true;
const sand = new THREE.Mesh(
  new THREE.CylinderGeometry(ISLAND_R + 3, ISLAND_R + 4, 0.9, 72),
  new THREE.MeshLambertMaterial({ color: 0xf0dfab })
);
sand.position.y = -0.56;
sand.receiveShadow = true;
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshLambertMaterial({ color: 0x5ec4e0 })
);
water.rotation.x = -Math.PI / 2;
water.position.y = -0.62;
scene.add(grass, sand, water);

// deterministic decoration
let seed = 7;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const trees = [];
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x9b6a43 });
const leafMats = [0x4fa64a, 0x5cb85a, 0x3f9645].map((c) => new THREE.MeshLambertMaterial({ color: c, flatShading: true }));
for (let i = 0; i < 26; i++) {
  const a = rand() * Math.PI * 2;
  const r = 6 + rand() * (ISLAND_R - 8);
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  const t = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.26, 1.4, 8), trunkMat);
  trunk.position.y = 0.7;
  const leaves = new THREE.Mesh(new THREE.IcosahedronGeometry(1 + rand() * 0.3, 0), leafMats[i % 3]);
  leaves.position.y = 2;
  leaves.scale.y = 1.15;
  for (const m of [trunk, leaves]) { m.castShadow = true; m.receiveShadow = true; }
  t.add(trunk, leaves);
  t.position.set(x, 0, z);
  scene.add(t);
  trees.push({ x, z, r: 0.75 });
}
const flowerColors = [0xffffff, 0xffd94a, 0xff8fb1, 0xff6b5b];
for (let i = 0; i < 90; i++) {
  const a = rand() * Math.PI * 2, r = 2 + rand() * (ISLAND_R - 3);
  const f = new THREE.Mesh(
    new THREE.SphereGeometry(0.09, 6, 6),
    new THREE.MeshLambertMaterial({ color: flowerColors[i % 4] })
  );
  f.position.set(Math.cos(a) * r, 0.08, Math.sin(a) * r);
  scene.add(f);
}

const marker = new THREE.Mesh(
  new THREE.RingGeometry(0.25, 0.38, 32),
  new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
);
marker.rotation.x = -Math.PI / 2;
marker.position.y = 0.02;
marker.visible = false;
scene.add(marker);

// ---------- player ----------
const player = new THREE.Group();
scene.add(player);
const turn = new THREE.Group(); // holds the 180° flip
player.add(turn);

let avatar = null;      // current visual root inside `turn`
let sample = null;      // parts of the procedural sample villager
let mixer = null;
let actions = [];       // { name, action }
let idleAction = null, walkAction = null, current = null;
let blobUrls = [];
let rig = null;         // bones driven by code when a model has a skeleton but no clips
let outfits = null;     // meshes that are alternative versions of the same clothing piece

// Game rips often stack every clothing variant on the body (e.g. mTops__TshirtsN, mTops__OnepieceH).
// Meshes sharing a name prefix and material are treated as variants and only one is shown.
function setupOutfits(obj) {
  const groups = new Map();
  obj.traverse((o) => {
    if (!o.isMesh || !o.name.includes('__')) return;
    const mat = [].concat(o.material)[0]?.name || '';
    const key = `${o.name.split('__')[0]}|${mat}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(o);
  });
  const set = [...groups.values()].filter((g) => g.length > 1).sort((a, b) => b.length - a.length)[0];
  if (!set) return null;
  set.sort((a, b) => a.name.localeCompare(b.name));
  const sel = $('outfitSelect');
  sel.innerHTML = '';
  set.forEach((m, i) => {
    const opt = document.createElement('option');
    opt.value = String(i);
    opt.textContent = outfitLabel(m.name.split('__').slice(1).join('__'));
    sel.appendChild(opt);
  });
  const preferred = set.findIndex((m) => /N$/.test(m.name) && !/mydesign|emm/i.test(m.name));
  sel.value = String(preferred >= 0 ? preferred : 0);
  $('outfitField').hidden = false;
  return set;
}

// Animal Crossing clothing mesh names: <type>[mydesign|emm]<sleeve N/H/L>, e.g. TshirtsH, OnepiecemydesignN
function outfitLabel(raw) {
  const m = raw.match(/^(Onepiece|Tshirts)(mydesign|emm)?([NHL])?$/i);
  if (!m) return raw;
  const type = /onepiece/i.test(m[1]) ? '원피스' : '티셔츠';
  const sleeve = { N: '민소매', H: '반팔', L: '긴팔' }[(m[3] || '').toUpperCase()] || '기본';
  const extra = m[2] ? (/mydesign/i.test(m[2]) ? ' · 마이디자인용' : ' · emm') : '';
  return `${type} · ${sleeve}${extra} (${raw})`;
}

function showOutfit(i) {
  outfits?.forEach((m, j) => { m.visible = j === i; });
}

// Animal Crossing style rigs share these bone names; other rigs fall back to a whole-body waddle.
const RIG_BONES = {
  legL: /^Leg_1_L$/i, legR: /^Leg_1_R$/i,
  armL: /^Arm_1_L$/i, armR: /^Arm_1_R$/i,
  spine: /^Spine_1$/i, head: /^Head$/i, tail: /^TailRoot$/i,
};
const AXIS_X = new THREE.Vector3(1, 0, 0);
const AXIS_Y = new THREE.Vector3(0, 1, 0);
const AXIS_Z = new THREE.Vector3(0, 0, 1);

function setupRig(obj, frame) {
  frame.updateMatrixWorld(true);
  const frameInv = frame.getWorldQuaternion(new THREE.Quaternion()).invert();
  // FBX exports can carry one copy of the skeleton per mesh, so every key holds all matching bones
  const bones = {};
  obj.traverse((o) => {
    if (!o.isBone || !o.parent) return;
    for (const [key, re] of Object.entries(RIG_BONES)) {
      if (!re.test(o.name)) continue;
      // parent orientation expressed in the character's own frame (+Y up, +Z forward)
      const parentQ = frameInv.clone().multiply(o.parent.getWorldQuaternion(new THREE.Quaternion()));
      (bones[key] ||= []).push({ bone: o, base: o.quaternion.clone(), parentQ, parentInv: parentQ.clone().invert() });
    }
  });
  if (!bones.legL || !bones.legR) return null;
  return bones;
}

const _dq = new THREE.Quaternion();
const _tq = new THREE.Quaternion();
// rotate bones from their bind pose by (axis, angle) pairs given in the character frame;
// the last pair is applied first
function turnBone(entries, ...rot) {
  if (!entries) return;
  _dq.identity();
  for (let i = 0; i < rot.length; i += 2) _dq.multiply(_tq.setFromAxisAngle(rot[i], rot[i + 1]));
  for (const e of entries) {
    e.bone.quaternion.copy(e.parentInv).multiply(_dq).multiply(e.parentQ).multiply(e.base);
  }
}

function makeSample() {
  const root = new THREE.Group();
  const mat = (c) => new THREE.MeshLambertMaterial({ color: c });
  const fur = mat(0xf3c58f), shirt = mat(0x5aa9e6), dark = mat(0x2b2118), pink = mat(0xff9fae), pants = mat(0x6b5a8e);

  const body = new THREE.Mesh(new THREE.SphereGeometry(0.36, 20, 16), shirt);
  body.scale.set(1, 1.05, 0.9);
  body.position.y = 0.62;

  const head = new THREE.Group();
  head.position.y = 1.22;
  const skull = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 20), fur);
  skull.scale.set(1.08, 0.95, 1);
  const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 12), mat(0xfff0dc));
  muzzle.position.set(0, -0.12, 0.42);
  muzzle.scale.set(1.2, 0.8, 0.7);
  const nose = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), dark);
  nose.position.set(0, -0.06, 0.55);
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.065, 12, 10), dark);
  eyeL.position.set(-0.18, 0.06, 0.45);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.18;
  const blushL = new THREE.Mesh(new THREE.CircleGeometry(0.07, 16), pink);
  blushL.position.set(-0.3, -0.08, 0.41); blushL.rotation.y = -0.5;
  const blushR = blushL.clone(); blushR.position.x = 0.3; blushR.rotation.y = 0.5;
  const earGeo = new THREE.ConeGeometry(0.16, 0.32, 4);
  const earL = new THREE.Mesh(earGeo, fur);
  earL.position.set(-0.3, 0.45, 0); earL.rotation.z = 0.35;
  const earR = earL.clone(); earR.position.x = 0.3; earR.rotation.z = -0.35;
  head.add(skull, muzzle, nose, eyeL, eyeR, blushL, blushR, earL, earR);

  const limb = (geo, m, x, y) => {
    const pivot = new THREE.Group();
    pivot.position.set(x, y, 0);
    const mesh = new THREE.Mesh(geo, m);
    mesh.position.y = -geo.parameters.height / 2;
    pivot.add(mesh);
    return pivot;
  };
  const legGeo = new THREE.CylinderGeometry(0.09, 0.1, 0.36, 10);
  const armGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.34, 10);
  const legL = limb(legGeo, pants, -0.14, 0.38);
  const legR = limb(legGeo, pants, 0.14, 0.38);
  const armL = limb(armGeo, fur, -0.38, 0.82);
  const armR = limb(armGeo, fur, 0.38, 0.82);
  armL.rotation.z = 0.25; armR.rotation.z = -0.25;

  root.add(body, head, legL, legR, armL, armR);
  root.traverse((o) => { if (o.isMesh) o.castShadow = true; });
  return { root, body, head, legL, legR, armL, armR };
}

function clearAvatar() {
  if (avatar) {
    turn.remove(avatar);
    avatar.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : o.material ? [o.material] : [];
      mats.forEach((m) => { for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose(); m.dispose(); });
    });
  }
  if (mixer) mixer.stopAllAction();
  mixer = null; actions = []; idleAction = walkAction = current = null;
  sample = null; avatar = null; rig = null; outfits = null;
  $('outfitField').hidden = true;
  blobUrls.forEach((u) => URL.revokeObjectURL(u));
  blobUrls = [];
  animSelect.innerHTML = '<option value="auto">자동 (멈추면 대기, 움직이면 걷기)</option>';
  animSelect.disabled = true;
}

// ---------- file loading ----------
function fitToHeight(obj, target = 1.7) {
  obj.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(obj);
  const h = box.max.y - box.min.y;
  if (!isFinite(h) || h <= 0) return;
  obj.scale.multiplyScalar(target / h);
  obj.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.x -= c.x;
  obj.position.z -= c.z;
  obj.position.y -= box.min.y;
}

function pickClip(re) {
  return actions.find((a) => re.test(a.name))?.action || null;
}

function play(action) {
  if (!action || action === current) return;
  action.reset().setEffectiveWeight(1).fadeIn(0.25).play();
  if (current) current.fadeOut(0.25);
  current = action;
}

async function expandZips(list) {
  const out = [];
  for (const f of list) {
    if (!/\.zip$/i.test(f.name)) { out.push(f); continue; }
    if (!window.JSZip) throw new Error('zip 라이브러리를 못 불러왔어. 압축을 풀어서 폴더 열기로 해줘.');
    const zip = await JSZip.loadAsync(f);
    for (const entry of Object.values(zip.files)) {
      if (entry.dir || entry.name.includes('__MACOSX')) continue;
      const blob = await entry.async('blob');
      out.push(new File([blob], entry.name.split('/').pop()));
    }
  }
  return out;
}

// Collada rips render more reliably than FBX ones; FBX materials often come out see-through.
const MODEL_PRIORITY = ['glb', 'gltf', 'dae', 'fbx'];

// ColladaLoader names bones by their sid (joint0, joint1, …). Restore the readable node names.
async function restoreColladaBoneNames(file, obj) {
  const doc = new DOMParser().parseFromString(await file.text(), 'application/xml');
  const names = new Map();
  for (const n of doc.querySelectorAll('node[type="JOINT"]')) {
    const sid = n.getAttribute('sid'), name = n.getAttribute('name') || n.getAttribute('id');
    if (sid && name) names.set(sid, name);
  }
  obj.traverse((o) => { if (o.isBone && names.has(o.name)) o.name = names.get(o.name); });
}

async function loadFiles(fileList) {
  let files;
  try {
    setStatus('파일 읽는 중…');
    files = await expandZips([...fileList]);
  } catch (err) {
    setStatus(`zip 열기 실패: ${err?.message || err}`, true);
    return;
  }
  const extOf = (f) => f.name.split('.').pop().toLowerCase();
  const main = files
    .filter((f) => MODEL_PRIORITY.includes(extOf(f)))
    .sort((a, b) => MODEL_PRIORITY.indexOf(extOf(a)) - MODEL_PRIORITY.indexOf(extOf(b)))[0];
  if (!main) {
    setStatus('모델 파일(.dae .fbx .glb .gltf)을 못 찾았어. 모델 파일이랑 텍스처 이미지를 같이 골라줘.', true);
    return;
  }
  setStatus(`${main.name} 불러오는 중…`);

  const urls = new Map();
  const newBlobs = [];
  for (const f of files) {
    const u = URL.createObjectURL(f);
    newBlobs.push(u);
    urls.set(f.name.toLowerCase(), u);
  }
  const mainUrl = urls.get(main.name.toLowerCase());
  const missing = new Set();

  const manager = new THREE.LoadingManager();
  manager.setURLModifier((url) => {
    if (url === mainUrl || url.startsWith('data:')) return url;
    const base = decodeURIComponent(url.split(/[\\/]/).pop().split('?')[0]).toLowerCase();
    if (urls.has(base)) return urls.get(base);
    if (base) missing.add(base);
    return url;
  });
  manager.addHandler(/\.tga$/i, new TGALoader(manager));

  const ext = main.name.split('.').pop().toLowerCase();
  let obj, clips;
  try {
    // Parse the model from memory: the artifact viewer's CSP refuses fetch() on blob: URLs,
    // so loader.load(blobUrl) fails there. Textures still go through <img>, which is allowed.
    const base = 'local/';
    if (ext === 'dae') {
      const c = new ColladaLoader(manager).parse(await main.text(), base);
      obj = c.scene; clips = c.scene.animations || [];
      await restoreColladaBoneNames(main, obj);
    } else if (ext === 'fbx') {
      obj = new FBXLoader(manager).parse(await main.arrayBuffer(), base);
      clips = obj.animations || [];
    } else {
      const data = ext === 'gltf' ? await main.text() : await main.arrayBuffer();
      const g = await new Promise((res, rej) => new GLTFLoader(manager).parse(data, base, res, rej));
      obj = g.scene; clips = g.animations || [];
    }
  } catch (err) {
    newBlobs.forEach((u) => URL.revokeObjectURL(u));
    setStatus(`불러오기 실패: ${err?.message || err}. 다른 포맷(.fbx/.dae)으로 받아서 다시 해봐.`, true);
    return;
  }

  clearAvatar();
  blobUrls = newBlobs;
  obj.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.frustumCulled = false;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => {
        if (!m) return;
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        if (m.map && m.transparent) m.alphaTest = 0.4;
      });
    }
  });
  fitToHeight(obj);
  avatar = new THREE.Group();
  avatar.add(obj);
  turn.add(avatar);

  if (clips.length) {
    mixer = new THREE.AnimationMixer(obj);
    actions = clips.map((clip, i) => ({ name: clip.name || `clip ${i + 1}`, action: mixer.clipAction(clip) }));
    idleAction = pickClip(/idle|wait|stand|breath/i) || actions[0].action;
    walkAction = pickClip(/walk|run|move/i) || (actions.length > 1 ? actions[1].action : actions[0].action);
    for (const a of actions) {
      const opt = document.createElement('option');
      opt.value = a.name;
      opt.textContent = a.name;
      animSelect.appendChild(opt);
    }
    animSelect.disabled = false;
    play(idleAction);
  }

  if (!clips.length) rig = setupRig(obj, avatar);
  // Animal Crossing rips include a placeholder hat mesh (Cap__…) that the game hides by default
  obj.traverse((o) => { if (o.isMesh && /^Cap__/i.test(o.name)) o.visible = false; });
  outfits = setupOutfits(obj);
  if (outfits) showOutfit(Number($('outfitSelect').value));

  const animNote = clips.length
    ? `애니메이션 ${clips.length}개 찾았어.`
    : rig
      ? '애니메이션은 없지만 뼈대를 찾아서 걷기 동작을 직접 붙였어.'
      : '애니메이션이 없어서 통통 튀는 걸음으로 대신 움직여.';
  const texNote = missing.size
    ? ` 텍스처 ${missing.size}개를 못 찾았어 (${[...missing].slice(0, 3).join(', ')}${missing.size > 3 ? ' …' : ''}). 폴더 열기로 다시 해봐.`
    : '';
  setStatus(`${main.name} 불러왔어. ${animNote}${texNote}`, missing.size > 0);
}

// ---------- input ----------
const keys = new Set();
const MOVE_KEYS = { KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1], KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0] };
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('select')) return;
  if (perfKeydown(e)) return;
  if (MOVE_KEYS[e.code]) { keys.add(e.code); target = null; marker.visible = false; e.preventDefault(); }
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) jump(); }
  if (e.code === 'KeyE' && !e.repeat) wave();
  if (e.code === 'KeyM' && !e.repeat) setPanel($('panel').hidden);
});

// ---------- actions ----------
const GRAVITY = 20;
const WAVE_TIME = 1.8;
let jumpY = 0, vy = 0, airborne = false;
let waveT = 0;

function jump() {
  if (airborne) return;
  airborne = true;
  vy = 6.2;
}
function wave() {
  waveT = WAVE_TIME;
  const clip = actions.find((a) => /wave|greet|hello/i.test(a.name));
  if (clip) { animSelect.value = clip.name; play(clip.action); }
}
$('jumpBtn').addEventListener('click', (e) => { jump(); e.currentTarget.blur(); });
$('waveBtn').addEventListener('click', (e) => { wave(); e.currentTarget.blur(); });
addEventListener('keyup', (e) => { keys.delete(e.code); perfKeyup(e); });
addEventListener('blur', () => keys.clear());

let target = null;
let downAt = null;
const ray = new THREE.Raycaster();
canvas.addEventListener('pointerdown', (e) => { downAt = { x: e.clientX, y: e.clientY }; });
canvas.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 8) return;
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hit = ray.intersectObject(grass)[0];
  if (hit) {
    target = new THREE.Vector3(hit.point.x, 0, hit.point.z);
    marker.position.set(target.x, 0.02, target.z);
    marker.visible = true;
  }
});

let camDist = 11;
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camDist = THREE.MathUtils.clamp(camDist + e.deltaY * 0.01, 5, 20);
}, { passive: false });

// ---------- loop ----------
const SPEED = 3.2;
const clock = new THREE.Clock();
let phase = 0;
let moving = false;
const camPos = new THREE.Vector3();
const lookAt = new THREE.Vector3();

function resize() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

function step(dt) {
  if (perf.active) { stepPerformance(dt); return; }
  const dir = new THREE.Vector3();
  for (const k of keys) { dir.x += MOVE_KEYS[k][0]; dir.z += MOVE_KEYS[k][1]; }
  if (target) {
    dir.set(target.x - player.position.x, 0, target.z - player.position.z);
    if (dir.length() < 0.12) { target = null; marker.visible = false; dir.set(0, 0, 0); }
  }
  moving = dir.lengthSq() > 0;
  if (moving) {
    dir.normalize();
    const next = player.position.clone().addScaledVector(dir, SPEED * dt);
    for (const t of trees) {
      const dx = next.x - t.x, dz = next.z - t.z, d = Math.hypot(dx, dz);
      if (d < t.r + 0.35) { const s = (t.r + 0.35) / (d || 1); next.x = t.x + dx * s; next.z = t.z + dz * s; }
    }
    const rr = Math.hypot(next.x, next.z);
    if (rr > ISLAND_R - 0.8) next.multiplyScalar((ISLAND_R - 0.8) / rr);
    player.position.copy(next);
    const want = Math.atan2(dir.x, dir.z);
    let diff = want - player.rotation.y;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    player.rotation.y += diff * Math.min(1, dt * 12);
    phase += dt * 9;
  } else {
    phase += dt * 2;
  }

  if (airborne) {
    vy -= GRAVITY * dt;
    jumpY += vy * dt;
    if (jumpY <= 0) { jumpY = 0; vy = 0; airborne = false; }
  }
  player.position.y = jumpY;
  waveT = Math.max(0, waveT - dt);
  // 0→1→0 envelope so the arm eases up and back down
  const waveK = waveT > 0 ? Math.min(1, (WAVE_TIME - waveT) * 5, waveT * 5) : 0;
  const waveSwing = Math.sin((WAVE_TIME - waveT) * 13) * 0.35;
  const air = airborne ? 1 : 0;

  // animation
  if (mixer) {
    if (animSelect.value === 'auto') play(moving ? walkAction : idleAction);
    mixer.update(dt);
  } else if (sample) {
    const swing = moving ? Math.sin(phase) * 0.7 : 0;
    sample.legL.rotation.x = swing;
    sample.legR.rotation.x = -swing;
    sample.armL.rotation.x = -swing * 0.8;
    sample.armR.rotation.x = swing * 0.8;
    const bob = moving ? Math.abs(Math.sin(phase)) * 0.06 : (reduceMotion ? 0 : Math.sin(phase) * 0.015);
    sample.root.position.y = bob;
    sample.head.rotation.z = moving ? Math.sin(phase) * 0.06 : 0;
    if (air) {
      sample.legL.rotation.x = sample.legR.rotation.x = -0.5;
      sample.armL.rotation.z = 0.25 + 1.2; sample.armR.rotation.z = -0.25 - 1.2;
    } else {
      sample.armL.rotation.z = 0.25; sample.armR.rotation.z = -0.25;
    }
    if (waveK) {
      // right hand on screen-left of the villager: lift the +x arm overhead and swing it
      sample.armR.rotation.x = 0;
      sample.armR.rotation.z = -0.25 + waveK * (2.7 + waveSwing);
      sample.head.rotation.z = waveK * 0.12;
    }
  } else if (rig) {
    const s = Math.sin(phase);
    const k = moving && !air ? 1 : 0;
    turnBone(rig.legL, AXIS_X, air ? -0.6 : s * 0.55 * k);
    turnBone(rig.legR, AXIS_X, air ? -0.35 : -s * 0.55 * k);
    // bind pose is a T-pose (left arm along +X, right along -X): lower both to the sides,
    // raise them a little while airborne, and swing them around X while walking
    const ARM_DOWN = 1.25;
    turnBone(rig.armL, AXIS_X, -s * 0.5 * k, AXIS_Z, air ? 0.5 : -ARM_DOWN);
    if (waveK) {
      const down = ARM_DOWN * (1 - waveK);
      const up = waveK * (0.45 + waveSwing); // big head: keep the hand low enough to peek out beside it
      turnBone(rig.armR, AXIS_Z, down - up);
    } else {
      turnBone(rig.armR, AXIS_X, s * 0.5 * k, AXIS_Z, air ? -0.5 : ARM_DOWN);
    }
    turnBone(rig.spine, AXIS_Y, s * 0.08 * k);
    turnBone(rig.head, AXIS_Z, waveK ? waveK * -0.15 : moving ? s * 0.06 : (reduceMotion ? 0 : Math.sin(phase * 0.7) * 0.04));
    turnBone(rig.tail, AXIS_Y, reduceMotion ? 0 : Math.sin(phase * (moving ? 1 : 1.6)) * 0.35);
    avatar.position.y = moving && !air ? Math.abs(s) * 0.05 : 0;
  } else if (avatar) {
    avatar.position.y = moving && !air ? Math.abs(Math.sin(phase)) * 0.08 : 0;
    avatar.rotation.z = waveK ? waveSwing * 0.3 : moving ? Math.sin(phase) * 0.07 : 0;
  }

  if (marker.visible && !reduceMotion) marker.scale.setScalar(1 + Math.sin(clock.elapsedTime * 6) * 0.1);

  // camera: high angle when far, lower and more frontal as you zoom in
  const zoomT = (camDist - 5) / 15;
  camPos.set(player.position.x, 0.8 + camDist * (0.2 + 0.52 * zoomT), player.position.z + camDist * 0.85);
  camera.position.lerp(camPos, Math.min(1, dt * 5));
  lookAt.set(player.position.x, 0.8, player.position.z);
  camera.lookAt(lookAt);

  sun.position.set(player.position.x + 8, 14, player.position.z + 6);
  sun.target.position.copy(player.position);
}

// A copy published with model/manifest.json next to the page opens that model on start.
async function loadBundled() {
  try {
    const res = await fetch('model/manifest.json', { cache: 'no-store' });
    if (!res.ok) return;
    const { files } = await res.json();
    // entries are "file.png" or { path: "model.xml", name: "model.dae" } when the host renames an extension
    const loaded = await Promise.all(files.map(async (entry) => {
      const { path, name } = typeof entry === 'string' ? { path: entry, name: entry } : entry;
      const r = await fetch(`model/${encodeURIComponent(path)}`);
      if (!r.ok) throw new Error(path);
      return new File([await r.blob()], name);
    }));
    await loadFiles(loaded);
  } catch {
    // no bundled model: keep the sample villager
  }
}

const COUNT_IN = 4;          // beats of clicks before the music starts
const WINDOW = { PERFECT: 0.06, GREAT: 0.11, GOOD: 0.16 };
const POINTS = { PERFECT: 1000, GREAT: 700, GOOD: 400, MISS: 0 };
const LANE_KEYS = ['KeyD', 'KeyF', 'KeyJ', 'KeyK'];
const LANE_LABELS = ['D', 'F', 'J', 'K'];
const LANE_COLORS = ['#ff8fb1', '#ffd45e', '#6fd3a0', '#71b9ff'];

function buildChart(song, level) {
  const spb = 60 / song.bpm;
  const notes = [];
  let beat = 0;
  for (const cycle of song.cycles) {
    for (const name of cycle.notes.split(' ')) {
      // easy: drop the off-beat eighths so the fast variation becomes quarter notes
      if (!(level === 'easy' && cycle.beat < 1 && beat % 1 !== 0)) {
        notes.push({ t: (COUNT_IN + beat) * spb, midi: midiOf(name) });
      }
      beat += cycle.beat;
    }
  }
  const musicBeats = beat;
  notes.push({ t: (COUNT_IN + musicBeats) * spb, midi: midiOf(song.ending) });

  const lo = Math.min(...notes.map((n) => n.midi));
  const hi = Math.max(...notes.map((n) => n.midi));
  for (const n of notes) n.lane = Math.min(3, Math.floor(((n.midi - lo) / (hi - lo + 1)) * 4));

  const accomp = [];
  for (let b = 0; b <= musicBeats; b += 2) {
    const i = (b / 2) % 8;
    const final = b === musicBeats;
    const t = (COUNT_IN + b) * spb;
    accomp.push({ t, midi: midiOf(final ? 'D2' : song.bass[i]), vel: 0.22, dur: final ? 3 : spb * 2.2 });
    for (const c of final ? ['F#4', 'A4', 'D5'] : song.chords[i]) {
      accomp.push({ t: t + 0.01, midi: midiOf(c), vel: 0.045, dur: final ? 3 : spb * 2 });
    }
  }
  const clicks = Array.from({ length: COUNT_IN }, (_, i) => i * spb);
  return { notes, accomp, clicks, spb, end: (COUNT_IN + musicBeats + 4) * spb };
}

// --- sound ---
let actx = null;
let master = null;
function tone(freq, when, vel = 0.2, dur = 1.2, type = 'triangle') {
  const o = actx.createOscillator();
  const o2 = actx.createOscillator();
  const g = actx.createGain();
  const g2 = actx.createGain();
  o.type = type; o.frequency.value = freq;
  o2.type = 'sine'; o2.frequency.value = freq * 2;
  g2.gain.value = 0.25;
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(master);
  g.gain.setValueAtTime(0.0001, when);
  g.gain.linearRampToValueAtTime(vel, when + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
  o.start(when); o2.start(when);
  o.stop(when + dur + 0.05); o2.stop(when + dur + 0.05);
}

// --- the instrument: a little keyboard on a stand ---
const piano = new THREE.Group();
const pianoKeys = [];
{
  const wood = new THREE.MeshLambertMaterial({ color: 0xc0573e });
  const dark = new THREE.MeshLambertMaterial({ color: 0x3a2a24 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(1.15, 0.12, 0.34), wood);
  body.position.y = 0.5;
  const legGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.46, 8);
  for (const x of [-0.5, 0.5]) for (const z of [-0.12, 0.12]) {
    const leg = new THREE.Mesh(legGeo, dark);
    leg.position.set(x, 0.23, z);
    piano.add(leg);
  }
  piano.add(body);
  const whiteGeo = new THREE.BoxGeometry(0.075, 0.035, 0.2);
  const whiteMat = new THREE.MeshLambertMaterial({ color: 0xfbf8f0 });
  const blackGeo = new THREE.BoxGeometry(0.045, 0.04, 0.12);
  for (let i = 0; i < 14; i++) {
    const k = new THREE.Mesh(whiteGeo, whiteMat);
    k.position.set(-0.49 + i * 0.0755, 0.575, -0.04);
    k.userData.rest = k.position.y;
    piano.add(k);
    pianoKeys.push(k);
    if (![2, 6, 9, 13].includes(i)) {
      const b = new THREE.Mesh(blackGeo, dark);
      b.position.set(k.position.x + 0.038, 0.6, -0.08);
      piano.add(b);
    }
  }
  piano.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  piano.visible = false;
  scene.add(piano);
}

// --- state ---
const perf = {
  active: false, song: 'canon', level: 'easy', auto: false,
  chart: null, t0: 0, now: 0,
  combo: 0, maxCombo: 0, score: 0,
  counts: { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 },
  judge: null, lanePress: [0, 0, 0, 0], laneHeld: [false, false, false, false],
  handL: 0, handR: 0, keyDip: new Array(14).fill(0), finished: false,
};
const rhythmEl = $('rhythm');
const rc = $('rhythmCanvas');
const rctx = rc.getContext('2d');

function sizeRhythm() {
  const dpr = Math.min(devicePixelRatio, 2);
  rc.width = Math.round(rc.clientWidth * dpr);
  rc.height = Math.round(rc.clientHeight * dpr);
  rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', () => { if (perf.active) sizeRhythm(); });

function openSongSheet() {
  if (perf.active) return;
  keys.clear(); target = null; marker.visible = false;
  $('songSheet').hidden = false;
  $('startSong').focus();
}
$('playBtn').addEventListener('click', openSongSheet);
$('cancelSong').addEventListener('click', () => { $('songSheet').hidden = true; });
$('startSong').addEventListener('click', () => {
  perf.song = document.querySelector('input[name="song"]:checked').value;
  perf.level = document.querySelector('input[name="level"]:checked').value;
  perf.auto = $('autoPlay').checked;
  $('songSheet').hidden = true;
  startPerformance();
});
$('stopSong').addEventListener('click', () => endPerformance());
$('againSong').addEventListener('click', () => { $('resultSheet').hidden = true; startPerformance(); });
$('closeResult').addEventListener('click', () => { $('resultSheet').hidden = true; endPerformance(); });

function startPerformance() {
  actx ||= new (window.AudioContext || window.webkitAudioContext)();
  actx.resume();
  if (master) master.disconnect();
  master = actx.createGain();
  master.gain.value = 0.7;
  master.connect(actx.destination);

  const chart = buildChart(SONGS[perf.song], perf.level);
  Object.assign(perf, {
    active: true, chart, combo: 0, maxCombo: 0, score: 0, judge: null, finished: false,
    counts: { PERFECT: 0, GREAT: 0, GOOD: 0, MISS: 0 },
  });
  chart.notes.forEach((n) => { n.done = null; });
  perf.t0 = actx.currentTime + 0.4;
  for (const c of chart.clicks) tone(1568, perf.t0 + c, 0.08, 0.08, 'square');
  for (const a of chart.accomp) tone(freqOf(a.midi), perf.t0 + a.t, a.vel, a.dur);

  // face the camera and set the keyboard in front of the character
  player.rotation.y = 0;
  piano.position.set(player.position.x, 0, player.position.z + 0.62);
  piano.visible = true;
  keys.clear(); target = null; marker.visible = false;
  setPanel(false);
  document.body.classList.add('playing');
  rhythmEl.hidden = false;
  resize();
  sizeRhythm();
}

function endPerformance() {
  if (master) {
    const m = master;
    m.gain.setTargetAtTime(0, actx.currentTime, 0.05);
    setTimeout(() => m.disconnect(), 400);
    master = null;
  }
  perf.active = false;
  piano.visible = false;
  rhythmEl.hidden = true;
  $('resultSheet').hidden = true;
  document.body.classList.remove('playing');
  resize();
}

function showResult() {
  perf.finished = true;
  const c = perf.counts;
  const total = perf.chart.notes.length;
  const acc = total ? (c.PERFECT + c.GREAT * 0.7 + c.GOOD * 0.4) / total : 0;
  const rank = acc >= 0.95 ? 'S' : acc >= 0.85 ? 'A' : acc >= 0.7 ? 'B' : acc >= 0.5 ? 'C' : 'D';
  $('resAcc').textContent = `${(acc * 100).toFixed(1)}%`;
  $('resRank').textContent = rank;
  $('resPerfect').textContent = c.PERFECT;
  $('resGreat').textContent = c.GREAT;
  $('resGood').textContent = c.GOOD;
  $('resMiss').textContent = c.MISS;
  $('resCombo').textContent = `최대 콤보 ${perf.maxCombo} · 점수 ${perf.score.toLocaleString()}${perf.auto ? ' · 자동 연주' : ''}`;
  $('resultSheet').hidden = false;
}

function judge(n, grade, when) {
  n.done = grade;
  perf.counts[grade]++;
  perf.score += POINTS[grade];
  if (grade === 'MISS') {
    perf.combo = 0;
  } else {
    perf.combo++;
    perf.maxCombo = Math.max(perf.maxCombo, perf.combo);
    tone(freqOf(n.midi), when ?? actx.currentTime, 0.22, 1.3);
    // left two lanes strike with the left hand, right two with the right
    if (n.lane < 2) perf.handL = 1; else perf.handR = 1;
    const key = Math.round(((n.midi - 69) / 14) * 13);
    perf.keyDip[THREE.MathUtils.clamp(key, 0, 13)] = 1;
  }
  perf.judge = { grade, at: perf.now };
}

function pressLane(lane) {
  perf.lanePress[lane] = 1;
  if (perf.auto || perf.finished) return;
  const now = actx.currentTime - perf.t0;
  let best = null;
  for (const n of perf.chart.notes) {
    if (n.done || n.lane !== lane) continue;
    const d = Math.abs(n.t - now);
    if (d <= WINDOW.GOOD && (!best || d < Math.abs(best.t - now))) best = n;
    if (n.t - now > WINDOW.GOOD) break;
  }
  if (!best) return;
  const d = Math.abs(best.t - now);
  judge(best, d <= WINDOW.PERFECT ? 'PERFECT' : d <= WINDOW.GREAT ? 'GREAT' : 'GOOD');
}

function perfKeydown(e) {
  if (!$('songSheet').hidden) {
    if (e.code === 'Escape') $('songSheet').hidden = true;
    return true; // no walking or jumping behind the dialog
  }
  if (!perf.active) {
    if (e.code === 'KeyP' && !e.repeat && $('songSheet').hidden) { openSongSheet(); return true; }
    return false;
  }
  e.preventDefault();
  if (e.code === 'Escape') { endPerformance(); return true; }
  const lane = LANE_KEYS.indexOf(e.code);
  if (lane >= 0 && !e.repeat) { perf.laneHeld[lane] = true; pressLane(lane); }
  return true;
}
function perfKeyup(e) {
  const lane = LANE_KEYS.indexOf(e.code);
  if (lane >= 0) perf.laneHeld[lane] = false;
}

function laneGeometry() {
  const w = rc.clientWidth, h = rc.clientHeight;
  const laneW = Math.min(110, (w - 32) / 4);
  const left = (w - laneW * 4) / 2;
  return { w, h, laneW, left, hitY: h - 64 };
}
rc.addEventListener('pointerdown', (e) => {
  if (!perf.active) return;
  const r = rc.getBoundingClientRect();
  const { laneW, left } = laneGeometry();
  const lane = Math.floor((e.clientX - r.left - left) / laneW);
  if (lane < 0 || lane > 3) return;
  e.preventDefault();
  rc.setPointerCapture?.(e.pointerId);
  perf.laneHeld[lane] = true;
  e.target.dataset[`p${e.pointerId}`] = lane;
  pressLane(lane);
});
const releasePointer = (e) => {
  const lane = e.target.dataset?.[`p${e.pointerId}`];
  if (lane !== undefined) { perf.laneHeld[Number(lane)] = false; delete e.target.dataset[`p${e.pointerId}`]; }
};
rc.addEventListener('pointerup', releasePointer);
rc.addEventListener('pointercancel', releasePointer);

function drawRhythm(now, fall) {
  const { w, h, laneW, left, hitY } = laneGeometry();
  const ctx = rctx;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#1b2130';
  ctx.fillRect(0, 0, w, h);

  for (let i = 0; i < 4; i++) {
    const x = left + i * laneW;
    const glow = Math.max(perf.lanePress[i], perf.laneHeld[i] ? 0.6 : 0);
    const grad = ctx.createLinearGradient(0, 0, 0, hitY);
    grad.addColorStop(0, 'rgba(255,255,255,0.02)');
    grad.addColorStop(1, `rgba(255,255,255,${0.05 + glow * 0.18})`);
    ctx.fillStyle = grad;
    ctx.fillRect(x + 2, 0, laneW - 4, hitY);
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(x, 0, 1, h);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.fillRect(left + laneW * 4, 0, 1, h);

  // falling notes
  const span = hitY + 20;
  for (const n of perf.chart.notes) {
    if (n.done && n.done !== 'MISS') continue;
    const dt = n.t - now;
    if (dt > fall) break;
    if (dt < -0.3) continue;
    const y = hitY - (dt / fall) * span;
    const x = left + n.lane * laneW;
    ctx.globalAlpha = n.done === 'MISS' ? 0.25 : 1;
    ctx.fillStyle = LANE_COLORS[n.lane];
    roundRect(ctx, x + 6, y - 9, laneW - 12, 18, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    roundRect(ctx, x + 10, y - 7, laneW - 20, 5, 3);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // hit line and key caps
  ctx.fillStyle = '#f4d36b';
  ctx.fillRect(left, hitY - 2, laneW * 4, 4);
  ctx.font = '600 16px "Jua", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < 4; i++) {
    const x = left + i * laneW;
    const on = perf.lanePress[i] > 0.05 || perf.laneHeld[i];
    ctx.fillStyle = on ? LANE_COLORS[i] : 'rgba(255,255,255,0.1)';
    roundRect(ctx, x + 6, hitY + 12, laneW - 12, 40, 10);
    ctx.fill();
    ctx.fillStyle = on ? '#1b2130' : 'rgba(255,255,255,0.75)';
    ctx.fillText(LANE_LABELS[i], x + laneW / 2, hitY + 32);
  }

  // HUD
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = '15px "Gowun Dodum", sans-serif';
  ctx.fillText(`${SONGS[perf.song].title} · ${perf.level === 'easy' ? '쉬움' : '보통'}${perf.auto ? ' · 자동' : ''}`, 14, 22);
  ctx.font = '600 18px "Jua", sans-serif';
  ctx.fillText(perf.score.toLocaleString(), 14, 46);
  const prog = THREE.MathUtils.clamp(now / perf.chart.end, 0, 1);
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  ctx.fillRect(0, 0, w, 3);
  ctx.fillStyle = '#f4d36b';
  ctx.fillRect(0, 0, w * prog, 3);

  if (now < 0 || now < COUNT_IN * perf.chart.spb) {
    const left4 = Math.ceil(COUNT_IN - now / perf.chart.spb);
    ctx.textAlign = 'center';
    ctx.font = '600 44px "Jua", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(String(THREE.MathUtils.clamp(left4, 1, COUNT_IN)), w / 2, hitY * 0.45);
  }
  if (perf.combo >= 2) {
    ctx.textAlign = 'center';
    ctx.font = '600 36px "Jua", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText(String(perf.combo), w / 2, hitY * 0.32);
    ctx.font = '13px "Gowun Dodum", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fillText('COMBO', w / 2, hitY * 0.32 + 26);
  }
  if (perf.judge && now - perf.judge.at < 0.5) {
    const a = 1 - (now - perf.judge.at) / 0.5;
    const colors = { PERFECT: '#ffd45e', GREAT: '#6fd3a0', GOOD: '#71b9ff', MISS: '#ff7a7a' };
    ctx.globalAlpha = a;
    ctx.textAlign = 'center';
    ctx.font = `600 ${26 + (1 - a) * 6}px "Jua", sans-serif`;
    ctx.fillStyle = colors[perf.judge.grade];
    ctx.fillText(perf.judge.grade, w / 2, hitY * 0.62);
    ctx.globalAlpha = 1;
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function stepPerformance(dt) {
  const now = actx.currentTime - perf.t0;
  perf.now = now;
  const chart = perf.chart;
  const fall = perf.level === 'easy' ? 1.9 : 1.5;

  if (!perf.finished) {
    for (const n of chart.notes) {
      if (n.done) continue;
      if (n.t - now > 0.05) break;
      if (perf.auto) { judge(n, 'PERFECT', perf.t0 + n.t); perf.lanePress[n.lane] = 1; continue; }
      if (now - n.t > WINDOW.GOOD) judge(n, 'MISS');
    }
    if (now > chart.end) showResult();
  }

  // decay hand/key/lane flashes
  const k = Math.min(1, dt * 9);
  perf.handL -= perf.handL * k;
  perf.handR -= perf.handR * k;
  for (let i = 0; i < 4; i++) perf.lanePress[i] -= perf.lanePress[i] * k;
  pianoKeys.forEach((key, i) => {
    perf.keyDip[i] -= perf.keyDip[i] * k;
    key.position.y = key.userData.rest - perf.keyDip[i] * 0.02;
  });

  // playing pose: both hands forward over the keys, striking on hits, head bobbing to the beat
  const beatT = Math.max(0, now) / chart.spb;
  const bob = reduceMotion ? 0 : Math.sin(beatT * Math.PI) * 0.06;
  player.rotation.y += (0 - player.rotation.y) * Math.min(1, dt * 10);
  player.position.y = 0;
  if (sample) {
    sample.legL.rotation.x = sample.legR.rotation.x = 0;
    sample.armL.rotation.x = -(1.25 - perf.handL * 0.4);
    sample.armR.rotation.x = -(1.25 - perf.handR * 0.4);
    sample.armL.rotation.z = 0.12;
    sample.armR.rotation.z = -0.12;
    sample.head.rotation.z = bob;
    sample.root.position.y = Math.abs(bob) * 0.2;
  } else if (rig) {
    const ARM_DOWN = 1.25;
    turnBone(rig.legL, AXIS_X, 0);
    turnBone(rig.legR, AXIS_X, 0);
    turnBone(rig.armL, AXIS_X, -(1.2 - perf.handL * 0.45), AXIS_Z, -ARM_DOWN);
    turnBone(rig.armR, AXIS_X, -(1.2 - perf.handR * 0.45), AXIS_Z, ARM_DOWN);
    turnBone(rig.spine, AXIS_Y, reduceMotion ? 0 : Math.sin(beatT * Math.PI * 0.5) * 0.06);
    turnBone(rig.head, AXIS_Z, bob);
    turnBone(rig.tail, AXIS_Y, reduceMotion ? 0 : Math.sin(beatT * Math.PI) * 0.3);
    avatar.position.y = 0;
  } else if (mixer) {
    play(idleAction);
    mixer.update(dt);
  }

  // three-quarter view from the front-left (the open side of the face) so the hands on the keys stay visible past the big head
  camPos.set(player.position.x - 1.7, 1.45, player.position.z + 2.6);
  camera.position.lerp(camPos, Math.min(1, dt * 4));
  lookAt.set(player.position.x, 0.75, player.position.z + 0.35);
  camera.lookAt(lookAt);
  sun.position.set(player.position.x + 8, 14, player.position.z + 6);
  sun.target.position.copy(player.position);

  drawRhythm(now, fall);
}

useSample();
loadBundled();
camera.position.set(0, camDist * 0.72, camDist * 0.78);
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  step(dt);
  renderer.render(scene, camera);
});
</script>
